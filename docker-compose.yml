services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: verity
      POSTGRES_USER: verity
      POSTGRES_PASSWORD: verity_dev_password
    ports:
      - "5432:5432"
    volumes:
      - verity-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verity -d verity"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/Verity.Api/Dockerfile
    ports:
      - "5080:5080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Verity: "Host=postgres;Port=5432;Database=verity;Username=verity;Password=verity_dev_password"
      # Development-only default; a real deployment must override this
      # with its own secret (e.g. via Jwt__SigningKey).
      Jwt__SigningKey: "development-only-signing-key-not-for-production-use"
      Seed__Enabled: "true"
      Seed__Password: "${SEED_PASSWORD:?Set SEED_PASSWORD in a local .env file - see .env.example}"
      Cors__AllowedOrigins__0: "http://localhost:4200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend/verity-web
    ports:
      - "4200:4200"
    depends_on:
      api:
        condition: service_healthy

volumes:
  verity-postgres-data:
