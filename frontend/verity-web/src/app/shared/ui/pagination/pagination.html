<nav class="pagination" aria-label="Pagination">
  <button type="button" [disabled]="!canGoPrev()" (click)="prev()">Previous</button>
  <span class="pagination__status">Page {{ page() }} of {{ totalPages() || 1 }}</span>
  <button type="button" [disabled]="!canGoNext()" (click)="next()">Next</button>
</nav>
