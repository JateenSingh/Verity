<div class="auth-form">
  <h1>Register</h1>

  @if (formError()) {
    <p class="auth-form__error" role="alert">{{ formError()?.title }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="auth-form__field">
      <label for="username">Username</label>
      <input id="username" type="text" formControlName="username" autocomplete="username" />
      <app-validation-message [control]="form.controls.username" />
    </div>

    <div class="auth-form__field">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
      <app-validation-message [control]="form.controls.email" />
    </div>

    <div class="auth-form__field">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password" />
      <app-validation-message [control]="form.controls.password" />
    </div>

    <div class="auth-form__field">
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" autocomplete="new-password" />
      <app-validation-message [control]="form.controls.confirmPassword" />
    </div>

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Creating account…' : 'Register' }}
    </button>
  </form>

  <p class="auth-form__switch">Already have an account? <a routerLink="/login">Log in</a></p>
</div>
